name: Publish container package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: Set up Java for Bazel Java targets
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bazelisk and Bazel cache
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true

      - name: Build the C++ application
        run: bazel build //cpp:hello

      - name: Stage the Bazel output for Docker
        run: |
          install -d package-context
          install -m 0755 "$(bazel cquery --output=files //cpp:hello)" package-context/hello

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the container image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --file deploy/Dockerfile --tag "${image}:${VERSION}" --tag "${image}:latest" package-context
          docker push "${image}:${VERSION}"
          docker push "${image}:latest"
